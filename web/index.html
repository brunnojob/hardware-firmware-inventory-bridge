<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hardware Inventory Bridge</title>
<style>body{margin:0;background:#080d14;color:#e2e9f2;font:16px system-ui}main{max-width:1000px;margin:5vh auto;padding:24px}h1{font-size:clamp(24px,4vw,40px)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card,table,canvas{background:#111d2c;border:1px solid #25354d;border-radius:10px}.card{padding:20px}.card strong{display:block;font-size:28px;color:#51ddc4}canvas{width:100%;height:220px;margin:24px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #25354d}a{color:#51ddc4}#state{color:#f2c66d}small{color:#a0b1c9}</style>
<main><small>SOFTWARE / HARDWARE / FIRMWARE</small><h1>Hardware Inventory Bridge</h1><p id="state" role="status">Waiting for device</p><div class="cards"><div class="card">Temperature<strong id="temperature">—</strong></div><div class="card">Humidity<strong id="humidity">—</strong></div><div class="card">Presence<strong id="presence">—</strong></div><div class="card">Frames accepted<strong id="frames">0</strong></div></div><canvas id="history" aria-label="Temperature history" role="img"></canvas><table><thead><tr><th>SKU</th><th>Quantity</th></tr></thead><tbody id="inventory"></tbody></table><p>Stock movements are entered in the local bridge terminal.</p><a href="https://brunnodev.store/">brunnodev.store</a></main>
<script>
const values=[];let lastSequence=null;let busy=false;
function draw(){const canvas=document.getElementById('history');const scale=devicePixelRatio||1;canvas.width=canvas.clientWidth*scale;canvas.height=220*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);const width=canvas.clientWidth;ctx.clearRect(0,0,width,220);if(values.length<2)return;const min=Math.min(...values)-1,max=Math.max(...values)+1;ctx.strokeStyle='#51ddc4';ctx.lineWidth=2;ctx.beginPath();values.forEach((v,i)=>{const x=16+i*(width-32)/(values.length-1),y=200-(v-min)*180/(max-min);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}
async function refresh(){if(busy)return;busy=true;try{const response=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(2000)});if(!response.ok)throw Error('bridge unavailable');const data=await response.json();document.getElementById('state').textContent=data.connected?(data.valid?'Device connected':'Device connected; sensor reading invalid'):'Device disconnected or stale';document.getElementById('temperature').textContent=data.connected&&data.valid?data.temperature.toFixed(2)+' °C':'—';document.getElementById('humidity').textContent=data.connected&&data.valid?data.humidity.toFixed(2)+' %':'—';document.getElementById('presence').textContent=data.connected?(data.presence?'Detected':'Clear'):'—';document.getElementById('frames').textContent=data.accepted;const rows=document.getElementById('inventory');rows.replaceChildren();for(const item of data.inventory){const row=document.createElement('tr');for(const value of [item.sku,item.quantity]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}rows.append(row)}if(data.connected&&data.valid&&data.sequence!==lastSequence){lastSequence=data.sequence;values.push(data.temperature);if(values.length>120)values.shift();draw()}}catch(error){document.getElementById('state').textContent='Bridge unavailable'}finally{busy=false}}
window.addEventListener('resize',draw);setInterval(refresh,1000);refresh();
</script></html>
